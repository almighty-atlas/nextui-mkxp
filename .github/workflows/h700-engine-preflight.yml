name: H700 engine input preflight (offline)
on:
  push:
    paths: ['build/h700-engine/**', 'scripts/check_h700_engine_inputs.py', 'tests/test_h700_engine_inputs.py', '.github/workflows/h700-engine-preflight.yml', 'docs/H700_ENGINE_PREFLIGHT.md']
  pull_request:
    paths: ['build/h700-engine/**', 'scripts/check_h700_engine_inputs.py', 'tests/test_h700_engine_inputs.py', '.github/workflows/h700-engine-preflight.yml', 'docs/H700_ENGINE_PREFLIGHT.md']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic offline tests (no cross-build or artifacts)
        run: python3 -I -B -m unittest discover -s tests -p 'test_h700_engine_inputs.py' -v
      - name: Complete branch whitespace check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            BASE=$(git merge-base origin/main "$HEAD")
          fi
          git diff --check "$BASE" "$HEAD"
