name: Issue 26 offline inspection tests
on:
  push:
    paths: ['scripts/issue_26_*.py', 'scripts/issue_26_tests/**', '.github/workflows/issue-26-offline.yml']
  pull_request:
    paths: ['scripts/issue_26_*.py', 'scripts/issue_26_tests/**', '.github/workflows/issue-26-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline negative tests (no target build or execution)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -I -m unittest discover -s scripts/issue_26_tests -v
      - name: Whitespace
        run: git show --check --oneline HEAD
