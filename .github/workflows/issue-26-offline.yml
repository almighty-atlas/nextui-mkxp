name: Issue 26 offline inspection tests
on:
  push:
    paths: ['scripts/issue_26_*.py', 'scripts/issue_26_tests/**', 'docs/build/issue-26-*', '.github/workflows/issue-26-offline.yml']
  pull_request:
    paths: ['scripts/issue_26_*.py', 'scripts/issue_26_tests/**', 'docs/build/issue-26-*', '.github/workflows/issue-26-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline negative tests (no target build or execution)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -I -m unittest discover -s scripts/issue_26_tests -v
      - name: Whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || format('refs/remotes/origin/{0}', github.event.repository.default_branch) }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I -B scripts/issue_26_ci.py --base "$BASE_REF" --head "$HEAD_REF"
