name: Provenance static checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate audit records and documentation links offline
        run: python3 scripts/check_provenance.py
      - name: Check whitespace
        run: git show --check --oneline HEAD
