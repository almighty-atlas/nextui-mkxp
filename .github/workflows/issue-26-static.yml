name: Issue 26 offline gates
on:
  pull_request:
    paths:
      - 'scripts/issue_26_*'
      - 'docs/build/issue-26-*'
      - '.github/workflows/issue-26-static.yml'
  push:
    paths:
      - 'scripts/issue_26_*'
      - 'docs/build/issue-26-*'
      - '.github/workflows/issue-26-static.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline host boundary and ELF policy tests
        run: python3 -I -B scripts/issue_26_test.py
