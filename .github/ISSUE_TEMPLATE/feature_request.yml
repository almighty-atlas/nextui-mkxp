name: Feature or improvement
description: Request one bounded improvement to NextUI mkxp
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / verification
    validations:
      required: true
